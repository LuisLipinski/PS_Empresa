name: CI - Quality gate

on:
  pull_request:
    branches: [ master ]
    types: [opened, synchronize, reopened]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Permissão Maven
        run: chmod +x ./mvnw

      - name: Unitários e quality gate
        run: |
          set -o pipefail
          ./mvnw -B clean verify 2>&1 | tee mvn-verify.log

      - name: Publicar log Maven
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-verify-log
          path: mvn-verify.log
          if-no-files-found: warn

      - name: Publicar relatório JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore

  core-regression:
    needs: unit-tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: mypetdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build jar
        run: ./mvnw -B clean package -DskipTests

      - name: Start API
        env:
          INTERNAL_API_KEY: mypetadmin-ci-internal-key
          JWT_SECRET_KEY: mypetadmin-ci-jwt-secret-key-32chars
        run: |
          nohup java -jar target/*.jar --spring.profiles.active=ci > app.log 2>&1 &

      - name: Wait API
        run: |
          for i in {1..40}; do
            if curl -s http://localhost:8081/actuator/health | grep UP; then
              echo "API pronta"
              exit 0
            fi
            sleep 5
          done
          echo "API não subiu"
          cat app.log
          exit 1

      - name: Checkout automation
        uses: actions/checkout@v4
        with:
          repository: LuisLipinski/ps_automacao_backend
          ref: main
          path: qa-tests

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qa-tests/package-lock.json

      - name: Install dependencies
        working-directory: qa-tests
        run: npm ci

      - name: Run Core Regression
        working-directory: qa-tests
        env:
          PS_EMPRESA_URL: http://localhost:8081
          PS_EMPRESA_INTERNAL_KEY: mypetadmin-ci-internal-key
        run: npm run empresa:regression
