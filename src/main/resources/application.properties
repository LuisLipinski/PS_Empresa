spring.application.name=ps_empresa
server.port=${PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mypetadmin}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Defaults abaixo são apenas para desenvolvimento local/test slices.
# O profile prod exige explicitamente INTERNAL_API_KEY e JWT_SECRET_KEY.
security.internal.key=${INTERNAL_API_KEY:local-only-internal-key-change-me}
security.jwt.secret=${JWT_SECRET_KEY:local-only-jwt-secret-key-change-me-32chars}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
